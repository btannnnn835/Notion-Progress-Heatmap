
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>My Daily Journal</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: transparent;
      color: light-dark(#242424, #eeeeee);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 19px;
      font-weight: 650;
      margin: 0 0 6px;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.65;
      margin: 0;
    }

    select {
      background: transparent;
      color: inherit;
      border: 1px solid #8885;
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .scroll {
      overflow-x: auto;
      padding: 12px 0;
    }

    .calendar {
      display: flex;
      gap: 5px;
      width: max-content;
    }

    .week {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .day {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      background: #d9dfe3;
      flex-shrink: 0;
      cursor: default;
    }

    .day.future {
      opacity: 0.35;
    }

    .day.outside {
      visibility: hidden;
    }

    .day:hover {
      outline: 2px solid #888;
      outline-offset: 1px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 15px;
      font-size: 11px;
      opacity: 0.85;
    }

    .legend span {
      margin: 0 5px;
    }

    .legend .day {
      width: 12px;
      height: 12px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .stat {
      font-size: 12px;
      opacity: 0.7;
    }

    .error {
      color: #e05a45;
    }
  </style>
</head>

<body>

  <div class="header">
    <div>
      <h2>My Daily Journal</h2>
      <p class="subtitle">
        A year of daily reflections
      </p>
    </div>

    <select id="yearSelect"
            aria-label="Select year">
    </select>
  </div>

  <div class="scroll">
    <div id="heatmap" class="calendar"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="footer">
    <span class="stat" id="status">
      Loading journal ratings...
    </span>

    <span class="stat" id="average"></span>
  </div>

  <script>
    // Rating colours: 1 (red) to 10 (green)
    const colors = [
      "#d93d49",
      "#e05a45",
      "#e77b44",
      "#ee9b49",
      "#eebc54",
      "#d5c65b",
      "#a8bf59",
      "#83b65a",
      "#57a96c",
      "#259967"
    ];

    const currentYear = new Date().getFullYear();
    const yearSelect =
      document.getElementById("yearSelect");

    const heatmap =
      document.getElementById("heatmap");

    const status =
      document.getElementById("status");

    const average =
      document.getElementById("average");

    let ratings = new Map();

    // Create year selector
    for (
      let year = currentYear;
      year >= currentYear - 5;
      year--
    ) {
      const option = document.createElement("option");
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    }

    // Use local date, not UTC
    function dateKey(date) {
      const year = date.getFullYear();

      const month = String(
        date.getMonth() + 1
      ).padStart(2, "0");

      const day = String(
        date.getDate()
      ).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    // Create the colour legend
    function createLegend() {
      const legend =
        document.getElementById("legend");

      legend.replaceChildren();

      const bad = document.createElement("span");
      bad.textContent = "Bad";
      legend.appendChild(bad);

      colors.forEach(color => {
        const square = document.createElement("div");
        square.className = "day";
        square.style.backgroundColor = color;
        legend.appendChild(square);
      });

      const good = document.createElement("span");
      good.textContent = "Great";
      legend.appendChild(good);
    }

    // Draw the full January–December calendar
    function renderHeatmap() {
      const selectedYear =
        Number(yearSelect.value);

      heatmap.replaceChildren();

      const firstDay =
        new Date(selectedYear, 0, 1);

      const lastDay =
        new Date(selectedYear, 11, 31);

      // Start on Sunday
      const start = new Date(firstDay);
      start.setDate(
        start.getDate() - start.getDay()
      );

      // End on Saturday
      const end = new Date(lastDay);
      end.setDate(
        end.getDate() + (6 - end.getDay())
      );

      const today = dateKey(new Date());

      let logged = 0;
      let total = 0;

      let week = null;

      for (
        let date = new Date(start);
        date <= end;
        date.setDate(date.getDate() + 1)
      ) {
        // Create a new column every Sunday
        if (date.getDay() === 0) {
          week = document.createElement("div");
          week.className = "week";
          heatmap.appendChild(week);
        }

        const key = dateKey(date);
        const rating = ratings.get(key);

        const square =
          document.createElement("div");

        square.className = "day";

        // Hide days outside selected year
        if (date.getFullYear() !== selectedYear) {
          square.classList.add("outside");
        }

        // Make future days faded
        if (key > today) {
          square.classList.add("future");
        }

        if (
          typeof rating === "number" &&
          rating >= 1 &&
          rating <= 10 &&
          date.getFullYear() === selectedYear
        ) {
          const index = Math.min(
            9,
            Math.max(0, Math.round(rating) - 1)
          );

          square.style.backgroundColor =
            colors[index];

          logged++;
          total += rating;
        }

        square.title =
          `${key}: ` +
          (rating == null
            ? "Not recorded"
            : `${rating}/10`);

        square.setAttribute(
          "aria-label",
          square.title
        );

        week.appendChild(square);
      }

      status.textContent =
        `${logged} journal days recorded`;

      average.textContent =
        logged > 0
          ? `Average rating: ${(total / logged).toFixed(1)}/10`
          : "No ratings yet";
    }

    // Fetch journal data from Notion API
    async function loadRatings() {
      try {
        const response = await fetch(
          "/api/database",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            `API returned ${response.status}`
          );
        }

        const entries = await response.json();

        if (!Array.isArray(entries)) {
          throw new Error(
            "Unexpected API response"
          );
        }

        ratings = new Map();

        entries.forEach(entry => {
          const date = entry.date;
          const rating = Number(entry.rating);

          if (
            typeof date === "string" &&
            Number.isFinite(rating) &&
            rating >= 1 &&
            rating <= 10
          ) {
            ratings.set(
              date.slice(0, 10),
              rating
            );
          }
        });

        status.classList.remove("error");
        renderHeatmap();

      } catch (error) {
        console.error("Heatmap error:", error);

        // Still render grey calendar squares
        renderHeatmap();

        status.textContent =
          "Could not load journal ratings. Check API.";

        status.classList.add("error");
      }
    }

    yearSelect.addEventListener(
      "change",
      renderHeatmap
    );

    createLegend();

    // Show the calendar immediately, even
    // if Notion has not responded yet.
    renderHeatmap();

    // Load actual journal ratings.
    loadRatings();

    // Automatically check for updates.
    setInterval(loadRatings, 30000);
  </script>

</body>
</html>
