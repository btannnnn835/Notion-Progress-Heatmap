
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>My Journal Heatmap</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 18px;
      background: transparent;
      color: light-dark(#242424, #eeeeee);
    }

    h2 {
      font-size: 18px;
      margin: 0 0 8px;
    }

    p {
      font-size: 12px;
      opacity: 0.7;
    }

    .scroll {
      overflow-x: auto;
      padding: 10px 0;
    }

    #heatmap {
      display: grid;
      grid-template-rows: repeat(7, 12px);
      grid-auto-columns: 12px;
      grid-auto-flow: column;
      gap: 3px;
      width: max-content;
    }

    .day {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: #d9dfe3;
      cursor: default;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 14px;
      font-size: 12px;
    }

    .legend .day {
      flex-shrink: 0;
    }

    .legend span {
      margin: 0 5px;
    }
  </style>
</head>

<body>
  <h2>My Daily Journal</h2>
  <p>How have my days been over the past year?</p>

  <div class="scroll">
    <div id="heatmap"></div>
  </div>

  <div class="legend" id="legend"></div>
  <p id="status">Loading journal ratings...</p>

  <script>
    const colors = [
      "#d93d49",
      "#e05a45",
      "#e77b44",
      "#ee9b49",
      "#eebc54",
      "#d5c65b",
      "#a8bf59",
      "#83b65a",
      "#57a96c",
      "#259967"
    ];

    function dateKey(date) {
      return date.toISOString().slice(0, 10);
    }

    async function loadHeatmap() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(
          "/api/database",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("API request failed");
        }

        const entries = await response.json();
        const ratings = new Map(
          entries.map(entry => [
            entry.date,
            entry.rating
          ])
        );

        const container =
          document.getElementById("heatmap");

        container.replaceChildren();

        const now = new Date();

        const now = new Date();
        const year = now.getFullYear();

        // Start on January 1
        const start = new Date(Date.UTC(year, 0, 1));

        // Finish on December 31
        const end = new Date(Date.UTC(year, 11, 31));

        // Align first column with Sunday
        start.setUTCDate(start.getUTCDate() - start.getUTCDay());
        );

        let logged = 0;

        for (
          let day = new Date(start);
          day <= today;
          day.setUTCDate(day.getUTCDate() + 1)
        ) {
          const key = dateKey(day);
          const rating = ratings.get(key);

          const square =
            document.createElement("div");

          square.className = "day";

          if (rating >= 1 && rating <= 10) {
            square.style.backgroundColor =
              colors[Math.round(rating) - 1];
            logged++;
          }

          square.title =
            `${key}: ` +
            (rating == null
              ? "Not recorded"
              : `${rating}/10`);

          container.appendChild(square);
        }

        status.textContent =
          `${logged} journal days recorded`;

      } catch (error) {
        status.textContent =
          "Could not load ratings. Check the API setup.";
        console.error(error);
      }
    }

    const legend = document.getElementById("legend");

    legend.innerHTML = "<span>Bad</span>";

    colors.forEach(color => {
      const square = document.createElement("div");
      square.className = "day";
      square.style.backgroundColor = color;
      legend.appendChild(square);
    });

    const label = document.createElement("span");
    label.textContent = "Great";
    legend.appendChild(label);

    loadHeatmap();

    // Refresh every 30 seconds while open
    setInterval(loadHeatmap, 30000);
  </script>
</body>
</html>
